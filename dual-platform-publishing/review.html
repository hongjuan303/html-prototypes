<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三平台批量发视频 · 原型与说明</title><link rel="stylesheet" href="./styles.css?v=1.6"></head><body class="review-body"><header class="review-top"><strong>三平台批量发视频 · 原型与说明</strong><a href="./index.html">打开纯原型 ↗</a><small>V1.6 · 2026-10-12 · 本地演示</small></header><div class="review-layout"><iframe id="prototype" class="review-prototype" src="./index.html?annotated=1&v=1.6" title="绿台交互原型"></iframe><aside class="review-notes" id="notes"></aside></div><script>
const common='<div class="review-note">演示边界：素材、账号、剧目和结果均为示例。抖音、视频号编辑字段已依据绿台当前发布的前端表单代码逐项核对；候选接口与真实发布未接入。视频素材仍从OSS选取；封面图片按原控件支持替换，在Demo中仅本地预览。</div>';
const note=(title,intro,sections)=>'<h1># 页面说明</h1><p>'+intro+'</p><h1 style="margin-top:28px"># 原型说明</h1><p><strong>需求：</strong>'+title+'</p>'+sections.map((s,i)=>'<h2><span class="num">'+(i+1)+'</span>'+s[0]+'</h2><ul>'+s[1].map(x=>'<li>'+x+'</li>').join('')+'</ul>').join('')+common;
const listFields={
 '抖音':[['筛选项',['抖音号名称、视频描述、发布状态、发布时间、端上合集名称、素材名。']],['列表字段',['抖音号、素材名、素材封面、视频描述、端上合集、发布状态、失败原因、发布成功时间、发布时间。']]],
 '视频号':[['筛选项',['视频号名称、素材名、发布状态、挂链类型、发布时间。']],['列表字段',['视频号名称、素材名、素材封面、素材描述、视频标注、关联合集、挂链类型、关联小程序、发布状态、发布失败原因、发布成功时间、发布时间。']]],
 '快手':[['筛选项',['快手号名称、素材名、发布状态、发布时间、挂载短剧名称、挂链类型。','挂链类型下拉单选：全部、作者服务、通栏服务。']],['列表字段',['快手号、素材名、素材封面、作品描述、挂链类型、挂载短剧名称、发布状态、失败原因、发布成功时间、发布时间。']]]
};
const listActions={
 '抖音':['操作列仅显示编辑：未到发布时间且尚未发布时可编辑；到时、已发布或进入执行时禁用，并显示原因。','点击编辑沿用抖音原字段弹窗，保存更新原记录，取消不改数据；保存时再次校验发布时间。'],
 '视频号':['操作列仅显示删除；确认后记录标记已删除，待执行任务取消。取消确认不改记录；已删除记录不可重复删除。'],
 '快手':['操作列仅显示编辑：未到发布时间且尚未发布时可编辑；到时、已发布或进入执行时禁用，并显示原因。','点击编辑沿用快手五项字段，保存更新原记录，取消不改数据；保存时再次校验时间及任务有效期。']
};
const pages={
 list:(step,p='抖音')=>note('同一菜单页按平台展示各自列表。','本页为'+p+'批量发视频列表。',[
 ['菜单与平台 Tab',['入口改为绿台 → 版权管理 → 抖微快批量发视频，作为版权管理下新增二级菜单。旧位置的批量发视频入口移除；顶部页签和面包屑同步名称。','保留抖音、视频号、快手三个 Tab；删除全部平台和各 Tab 数字。','抖音、视频号沿用原菜单的筛选和列表字段；快手使用业务指定清单。','此前平台多选、创建日期、发布日期与通用挂链目标调整，已由后续平台专属清单覆盖。']],...listFields[p],
 ['操作与结果',[...listActions[p],'搜索、重置、导出作用于当前平台。切换平台保留各自筛选条件。','发布成功时间独立于发布时间。历史缺失值显示“—”，不从计划时间猜测。','字段较多时表格横向滚动，右侧操作固定。']]]),
 wizard:step=>step===1?note('从OSS选择剪辑提前上传的素材。','本页为新增发视频—选择素材页。',[
 ['选择素材',['打开OSS文件库弹窗，支持搜索、文件夹筛选、跨页勾选和状态判断。','无本地上传入口，不前置业务类型、剧目或题材。']],
 ['任务引用',['同一素材可用于多个平台，最多100份。移除只取消任务引用，不删除OSS文件。']]]):step===2?note('多个平台上下展示，各自展开后按素材逐条编辑。','本页为新增发视频—分配账号与挂链页。',[
 ['发布平台',['上方勾选本次需要的平台；下方按抖音、视频号、快手上下排列，不用Tab切换。','每个平台区块增加展开/收起箭头；各区可同时展开，折叠不丢配置。']],
 ['素材操作',['每区保留选择素材入口，直接使用OSS文件库；同一文件按引用复用，不重复加入源素材。','三个平台均先在素材行选择账号，也支持批量选择；点击“编辑素材”只编辑该账号对应的字段。','“同步信息”按原弹窗显示：提示、全选、纵向素材名称、取消/确定。包含当前素材，每份一项，打开默认全选；取消重开恢复全选，确定只同步勾选项。','抖音同时同步源账号；视频号及快手保留目标账号，不同账号的合集或任务需重新选择。','视频号保留“匹配视频号”入口；匹配账号不代表已完成选剧。','在单个平台移除素材不影响其他平台。']],
 ['编辑素材',['抖音原弹窗字段：添加标签、视频封面、视频描述、发布时间。标签类型固定付费内容，端上合集来自当前抖音号；描述限制100字。定时展开日期时间及2小时后/14天内提示。','视频号原弹窗：挂链类型四项单选、关联合集、视频标注（AI内容复选框）、视频封面、描述/视频描述、发布时间（日期时间）。自营场景额外显示只读标题；仅自营小程序显示关联小程序下拉。自营用选择合集按钮，外部用对应合集下拉，外部视频描述限制100字。','快手挂链类型单选作者服务/通栏服务，分别默认关联变现任务/关联短剧变现任务，再选具体任务。','快手编辑弹窗仅五项：作品描述、封面设置、挂链类型、作者声明、发布时间。描述默认#剧名#短剧题材，选任务后带入，可直接修改；封面默认首帧，声明默认“演绎情节，仅供娱乐”；发布时间单选立即/定时。任务下拉在挂链类型下，不额外增加剧名或题材输入。','抖音/视频号弹窗不放账号选择或可见范围；按钮恢复“取消、确定”。封面可删除替换，必填校验保留。每份素材在不同账号分别保存描述、封面和时间，取消不写入。']]]):note('逐条确认实际账号、挂链与发布内容。','本页为新增发视频—确认发布页。',[
 ['数量与校验',['按本次各平台选取的素材和账号计算明细。缺账号、目标或描述变量时提示原因。','快手任务按账号与服务隔离，定时发布按准确计划时间验证有效期。']],
 ['内容快照',['展示最终文案、挂链ID与时间；快手另展示封面策略和作者声明。','只提交通过项需明确勾选，问题明细保留草稿。']],
 ['提交',['创建演示任务后统一查看批次结果，成功任务不随失败项重复提交。']]]),
 config:()=>note('维护平台文案模板。','本页为内容分发—发布配置页。',[
 ['文案模板',['抖音/视频号支持{剧目名}；快手支持#{剧名}#{短剧题材}。','逐条素材编辑保存描述；模板更新不改写已提交记录。']]]),
 batch:()=>note('统一查看本次三平台发布结果。','本页为发布批次详情。',[
 ['发布结果',['按实际明细统计进度，详情保留OSS引用和平台配置快照。','失败按平台、账号与阶段处理，已成功作品不重发。']]])};
function show(m){document.getElementById('notes').innerHTML=(pages[m.page]||pages.list)(m.step,m.platform)}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='publishing-page')show(e.data)});show({page:'list',platform:'抖音'});
</script></body></html>
