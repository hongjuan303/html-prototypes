<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>容量万相｜生态合作地图重设计</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#"><i></i><strong>容量·万相</strong></a>
    <nav><a href="#">首页</a><a href="#">小说IP库</a><a href="#">剧本库</a><a href="#">资产库</a><a href="#">Agent工具</a><a class="is-active" href="#">生态创新中心</a><span></span><a href="#">漫剧制作</a></nav>
    <button type="button">商务合作</button>
  </header>

  <main>
    <section class="intro">
      <div><span>ECOSYSTEM COLLABORATION</span><h1>每一座城市，都有值得被看见的故事</h1></div>
      <p>连接地方文化、产业伙伴与创作者，<br>让精品内容在真实地域中生长。</p>
    </section>

    <section class="map-shell">
      <div class="map-stage">
        <div class="map-meta"><span>全国生态合作网络</span><strong>21 个项目 · 13 个市县</strong></div>
        <svg class="china-map" viewBox="0 0 920 590" aria-label="中国生态合作城市地图">
          <g data-map-shapes></g>
          <g data-map-routes></g>
          <g data-map-markers></g>
        </svg>
        <div class="map-tip"><i></i><span>合作城市</span><em>点击城市查看作品</em></div>
      </div>

      <aside class="story-panel">
        <header><div><span data-region>浙江省</span><h2 data-city>杭州</h2></div><em data-project-count>7 个合作项目</em></header>
        <div class="featured-work">
          <img data-cover src="../ai-drama-website-optimization/assets/qa-script-1.jpg" alt="作品封面">
          <div class="featured-shade"></div>
          <span data-category>文旅短剧</span>
          <div><small data-location>浙江省杭州市富阳区</small><h3 data-work>《马年限定之新春有约》</h3></div>
        </div>
        <p class="work-intro" data-description>容量短剧出品的春节年俗轻喜剧，在富阳龙门古镇实地取景，以中外文化碰撞展现年味新表达。</p>
        <div class="work-list" data-work-list></div>
        <button class="detail-button" type="button">查看该城市全部项目 <span>↗</span></button>
      </aside>
    </section>

    <footer class="page-note"><span>该页面为合作地图重设计提案，不影响正式官网。</span><strong>核心原则：地图只展示城市，内容按需展开</strong></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
