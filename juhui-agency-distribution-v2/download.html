<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文件下载</title><style>body{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f7fa;margin:0;padding:60px;color:#303133}main{max-width:600px;background:white;padding:32px;border:1px solid #dfe4ee;border-radius:6px;margin:auto}h1{font-size:20px}a{display:inline-block;color:#fff;background:#409eff;padding:10px 18px;border-radius:4px;text-decoration:none;margin-top:20px}p{line-height:1.8;overflow-wrap:anywhere}.error{color:#f56c6c}</style></head><body><main><h1>文件下载</h1><p id="name">正在准备文件…</p><a id="download" hidden>点击下载</a><p id="error" class="error"></p></main><script>
async function prepareDownload(){if(!location.hash)return;const meta=JSON.parse(decodeURIComponent(location.hash.slice(1)));document.getElementById('name').textContent=meta.name;let blob;if(meta.url){const r=await fetch(meta.url);if(!r.ok)throw Error('文件原件暂不可用');blob=await r.blob();}else{const db=await new Promise((resolve,reject)=>{const req=indexedDB.open('juhui-agency-distribution-v2-files',1);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});blob=await new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').get(meta.id);req.onsuccess=()=>req.result?resolve(req.result):reject(Error('文件原件不可用'));req.onerror=()=>reject(req.error)});}const a=document.getElementById('download');a.href=URL.createObjectURL(blob);a.download=meta.name;a.hidden=false;a.click();} function run(){prepareDownload().catch(e=>{document.getElementById('error').textContent=e.message;document.getElementById('name').textContent='无法准备下载，请返回原页面重新选择。';});} window.addEventListener('hashchange',run);run();
</script></body></html>
