<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>供应商演示登录 · V2</title><style>body{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f3f5;color:#303133;margin:0}main{width:380px;margin:90px auto;background:#fff;padding:35px;border:1px solid #dfe4ee;border-radius:6px}h1{font-size:20px;margin:0 0 26px}label{display:grid;gap:9px;margin:20px 0}input{font:inherit;padding:10px;border:1px solid #dcdfe6;border-radius:4px}button{width:100%;padding:11px;border:0;background:#409eff;color:#fff;font:inherit;border-radius:4px}p{font-size:12px;line-height:1.8;color:#909399}#error{color:#f56c6c}</style></head><body><main><h1>容量剧汇 · 供应商登录</h1><form><label>登录账号 / 手机号<input name="account" required autocomplete="off"></label><label>密码<input name="password" type="password" required autocomplete="off"></label><button>登录</button><p id="error" role="alert"></p></form><p>V2本地演示。初始演示账号 xingfan-demo，手机号13800000001，演示密码 DemoOnly123；修改后使用新值登录。请勿输入真实账号密码。</p></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),config=JSON.parse(localStorage.getItem('juhui-agency-distribution-v2-config')||'null'),s=config?.suppliers.find(s=>(s.account===data.get('account')||s.phone===data.get('account'))&&s.password===data.get('password'));if(!s){document.getElementById('error').textContent='账号或密码不正确。';return;}if(s.frozen){document.getElementById('error').textContent='该供应商账号已冻结。';return;}sessionStorage.setItem('juhui-agency-distribution-v2-supplier',s.id);location.href='./?v=20261118-v2-34#supplierEval';};</script></body></html>
