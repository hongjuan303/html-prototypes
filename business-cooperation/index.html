<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>容量万相 - 商务合作表单</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 860px; background: #050708; color: #f4f7f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 23%, rgba(16, 153, 158, .14), transparent 32%),
        linear-gradient(180deg, #070a0c 0%, #040506 100%);
    }
    .nav {
      position: relative;
      z-index: 1;
      width: calc(100% - 112px);
      height: 66px;
      margin: 22px 56px 0;
      padding: 0 26px;
      display: flex;
      align-items: center;
      gap: 36px;
      border: 1px solid #242a2f;
      border-radius: 34px;
      background: rgba(17, 20, 22, .9);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .38);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; white-space: nowrap; }
    .brand-mark { width: 24px; height: 24px; border-radius: 5px; transform: rotate(45deg); background: linear-gradient(135deg, #16d0c7 0 52%, #dffbfa 52%); }
    .nav-links { display: flex; align-items: center; gap: 31px; color: #9ca5ab; font-size: 15px; }
    .nav-links .active { color: #fff; }
    .nav-spacer { flex: 1; }
    .language { color: #aeb6bb; font-size: 14px; }
    .cooperate-outline { height: 38px; padding: 0 19px; border: 1px solid #4d555a; border-radius: 20px; color: #e8edef; background: transparent; }

    .hero {
      position: relative;
      z-index: 0;
      width: calc(100% - 160px);
      max-width: 1320px;
      height: 500px;
      margin: 46px auto 0;
      border: 1px solid #1e2529;
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(3, 7, 10, .98) 0%, rgba(3, 7, 10, .78) 45%, rgba(3, 7, 10, .15) 100%),
        url("assets/seedance-banner.png") center/cover no-repeat;
    }
    .hero-copy { width: 520px; padding: 104px 0 0 64px; }
    .eyebrow { color: #2edbd3; font-size: 14px; letter-spacing: 0; }
    .hero h1 { margin: 17px 0 18px; font-size: 48px; line-height: 1.18; letter-spacing: 0; }
    .hero p { margin: 0; color: #a8b2b8; font-size: 18px; line-height: 1.8; }

    .shade { position: absolute; z-index: 3; inset: 0; background: rgba(0, 3, 5, .68); backdrop-filter: blur(2px); }
    .dialog {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 820px;
      transform: translate(-50%, -50%);
      border: 1px solid #333b40;
      border-radius: 8px;
      background: #111518;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .72);
      overflow: hidden;
    }
    .dialog-header { position: relative; padding: 27px 32px 22px; border-bottom: 1px solid #282f34; }
    .dialog-header h2 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; letter-spacing: 0; }
    .dialog-header p { margin: 0; color: #89949b; font-size: 14px; }
    .close {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #9aa4aa;
      font-size: 26px;
      line-height: 32px;
      text-align: center;
    }
    .close:hover { color: #fff; background: #20262a; }
    .form { padding: 22px 32px 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 17px; }
    .row.full { grid-template-columns: 1fr; }
    .field label { display: block; margin-bottom: 8px; color: #dbe1e4; font-size: 14px; line-height: 1.3; }
    .required { color: #34d5cd; margin-left: 3px; }
    .control, .contact-control, .multi-control {
      width: 100%;
      height: 42px;
      border: 1px solid #384147;
      border-radius: 6px;
      color: #eef2f4;
      background: #181d21;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input.control, select.control { padding: 0 13px; }
    select.control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #7f8a90 50%), linear-gradient(135deg, #7f8a90 50%, transparent 50%); background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px; background-size: 5px 5px; background-repeat: no-repeat; }
    .control::placeholder, textarea::placeholder { color: #68737a; }
    .control:focus, textarea:focus, .contact-control:focus-within, .multi-control:focus-within { border-color: #20c9c1; box-shadow: 0 0 0 2px rgba(32, 201, 193, .12); }
    .contact-control { display: grid; grid-template-columns: 92px 1fr; overflow: hidden; }
    .contact-control select, .contact-control input { min-width: 0; border: 0; outline: 0; color: #eef2f4; background: transparent; }
    .contact-control select { padding: 0 12px; border-right: 1px solid #384147; appearance: none; }
    .contact-control input { padding: 0 13px; }
    .multi-control { display: flex; align-items: center; gap: 7px; padding: 5px 10px; }
    .tag { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid rgba(38, 211, 201, .35); border-radius: 4px; color: #65e7df; background: rgba(25, 181, 174, .11); font-size: 13px; }
    .tag span { margin-left: 7px; color: #87aaa8; }
    .multi-placeholder { color: #68737a; font-size: 13px; }
    .helper { margin-top: 6px; color: #68737a; font-size: 12px; }
    textarea.control { height: 76px; padding: 11px 13px; resize: none; line-height: 1.55; }
    .counter { float: right; margin-top: -22px; margin-right: 10px; color: #68737a; font-size: 12px; pointer-events: none; }
    .consent { display: flex; align-items: flex-start; gap: 9px; margin-top: 2px; color: #89949b; font-size: 13px; line-height: 1.55; }
    .consent input { width: 15px; height: 15px; margin: 2px 0 0; accent-color: #1fc9c0; }
    .consent a { color: #4fded6; text-decoration: none; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 17px 32px 22px; border-top: 1px solid #282f34; background: #101417; }
    .btn { height: 40px; padding: 0 21px; border-radius: 6px; text-align: center; }
    .btn.secondary { border: 1px solid #3a444a; color: #cbd2d6; background: transparent; }
    .btn.primary { min-width: 138px; border: 1px solid #20c9c1; color: #071011; font-weight: 600; background: #26d3c9; box-shadow: 0 8px 22px rgba(38, 211, 201, .2); }
    .btn.primary:hover { background: #42dfd7; }
    .success { display: none; padding: 62px 40px 58px; text-align: center; }
    .success-icon { width: 54px; height: 54px; margin: 0 auto 20px; border-radius: 50%; color: #04100f; background: #2bd7ce; font-size: 31px; line-height: 54px; }
    .success h3 { margin: 0 0 10px; font-size: 22px; }
    .success p { margin: 0 0 26px; color: #8e999f; font-size: 14px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="nav">
      <div class="brand"><span class="brand-mark"></span><span>容量·万相</span></div>
      <nav class="nav-links">
        <span class="active">首页</span><span>小说IP库</span><span>剧本库</span><span>资产库</span><span>Agent工具</span><span>漫剧制作</span>
      </nav>
      <div class="nav-spacer"></div>
      <span class="language">中&nbsp;&nbsp;A</span>
      <button class="cooperate-outline" id="openDialog">商务合作</button>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">AI DRAMA PRODUCTION PLATFORM</div>
        <h1>全产业链驱动<br />让好故事走向全球</h1>
        <p>从优质IP、智能创作到全域发行，<br />为专业内容团队提供一站式漫剧生产能力。</p>
      </div>
    </section>

    <div class="shade" id="shade"></div>
    <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div id="formView">
        <header class="dialog-header">
          <h2 id="dialogTitle">商务合作</h2>
          <p>请留下合作需求，我们将在 1 个工作日内与您联系</p>
          <button class="close" id="closeDialog" aria-label="关闭">×</button>
        </header>

        <form id="cooperationForm">
          <div class="form">
            <div class="row">
              <div class="field">
                <label>姓名<span class="required">*</span></label>
                <input class="control" required maxlength="20" placeholder="请输入您的姓名" />
              </div>
              <div class="field">
                <label>公司 / 机构名称<span class="required">*</span></label>
                <input class="control" required maxlength="50" placeholder="请输入公司或机构名称" />
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label>联系方式<span class="required">*</span></label>
                <div class="contact-control">
                  <select aria-label="联系方式类型"><option>手机</option><option>微信</option><option>邮箱</option></select>
                  <input required placeholder="请输入手机号" />
                </div>
              </div>
              <div class="field">
                <label>职位 / 角色</label>
                <select class="control">
                  <option value="">请选择</option><option>企业负责人</option><option>内容负责人</option><option>制片人</option><option>导演</option><option>编剧</option><option>投资机构</option><option>政府或事业单位</option><option>其他</option>
                </select>
              </div>
            </div>

            <div class="row full">
              <div class="field">
                <label>合作方向<span class="required">*</span></label>
                <div class="multi-control" tabindex="0">
                  <span class="tag">漫剧制作<span>×</span></span>
                  <span class="tag">海外发行<span>×</span></span>
                  <span class="multi-placeholder">请选择合作方向</span>
                </div>
                <div class="helper">支持多选：IP版权合作、漫剧制作、AI工具/平台合作、内容发行与投流、海外发行、政企项目、其他</div>
              </div>
            </div>

            <div class="row full">
              <div class="field">
                <label>合作需求<span class="required">*</span></label>
                <textarea class="control" required minlength="10" maxlength="500" placeholder="请简要描述项目背景、内容体量、合作目标等信息"></textarea>
                <span class="counter">0 / 500</span>
              </div>
            </div>

            <div class="consent">
              <input id="privacyConsent" type="checkbox" required checked />
              <span><label for="privacyConsent">我已阅读并同意</label><a href="privacy.html" target="_blank" rel="noopener" onclick="return openPrivacyPolicy(event)">《隐私政策》</a>，同意平台为商务合作目的联系我</span>
            </div>
          </div>
          <footer class="dialog-footer">
            <button class="btn secondary" type="button" id="cancelDialog">取消</button>
            <button class="btn primary" type="submit">提交合作意向</button>
          </footer>
        </form>
      </div>

      <div class="success" id="successView">
        <div class="success-icon">✓</div>
        <h3>提交成功</h3>
        <p>合作顾问将在 1 个工作日内与您联系，请保持联系方式畅通。</p>
        <button class="btn primary" id="successClose">知道了</button>
      </div>
    </section>
  </main>

  <script>
    const shade = document.getElementById('shade');
    const dialog = document.getElementById('dialog');
    const form = document.getElementById('cooperationForm');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const textarea = document.querySelector('textarea');
    const counter = document.querySelector('.counter');

    function openDialog() { shade.style.display = 'block'; dialog.style.display = 'block'; }
    function closeDialog() { shade.style.display = 'none'; dialog.style.display = 'none'; }
    function openPrivacyPolicy(event) {
      event.preventDefault();
      event.stopPropagation();
      const policyUrl = new URL('privacy.html', window.location.href).href;
      const policyWindow = window.open(policyUrl, '_blank');
      if (policyWindow) {
        policyWindow.opener = null;
      } else {
        window.location.href = policyUrl;
      }
      return false;
    }
    document.getElementById('openDialog').addEventListener('click', openDialog);
    document.getElementById('closeDialog').addEventListener('click', closeDialog);
    document.getElementById('cancelDialog').addEventListener('click', closeDialog);
    document.getElementById('successClose').addEventListener('click', closeDialog);
    shade.addEventListener('click', closeDialog);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDialog(); });
    textarea.addEventListener('input', () => { counter.textContent = `${textarea.value.length} / 500`; });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      formView.style.display = 'none';
      successView.style.display = 'block';
    });
  </script>
</body>
</html>
