.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;hulunbuir-roadtrip-map&quot;&gt;
  &lt;style&gt;
    #hulunbuir-roadtrip-map { color: var(--foreground); width: 100%; }
    #hulunbuir-roadtrip-map .route-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
    #hulunbuir-roadtrip-map h2 { margin:0; }
    #hulunbuir-roadtrip-map .route-meta { color:var(--muted-foreground); }
    #hulunbuir-roadtrip-map .map-wrap { position:relative; width:100%; min-height:560px; overflow:hidden; }
    #hulunbuir-roadtrip-map .map-svg { display:block; width:100%; height:auto; min-height:560px; }
    #hulunbuir-roadtrip-map .terrain { fill:var(--muted); opacity:.45; }
    #hulunbuir-roadtrip-map .river { fill:none; stroke:var(--blue); stroke-width:7; opacity:.22; stroke-linecap:round; }
    #hulunbuir-roadtrip-map .route-shadow { fill:none; stroke:var(--background); stroke-width:10; stroke-linejoin:round; stroke-linecap:round; }
    #hulunbuir-roadtrip-map .route-line { fill:none; stroke:var(--viz-series-1); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    #hulunbuir-roadtrip-map .return-line { fill:none; stroke:var(--viz-series-2); stroke-width:4; stroke-dasharray:9 7; stroke-linecap:round; }
    #hulunbuir-roadtrip-map .forest-line { fill:none; stroke:var(--viz-series-3); stroke-width:7; stroke-linejoin:round; stroke-linecap:round; }
    #hulunbuir-roadtrip-map .node { cursor:pointer; }
    #hulunbuir-roadtrip-map .node-dot { fill:var(--card); stroke:var(--viz-series-1); stroke-width:4; }
    #hulunbuir-roadtrip-map .node.active .node-dot { fill:var(--primary); stroke:var(--primary); }
    #hulunbuir-roadtrip-map .node-num { fill:var(--foreground); font-weight:500; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    #hulunbuir-roadtrip-map .node.active .node-num { fill:var(--primary-foreground); }
    #hulunbuir-roadtrip-map .place { fill:var(--foreground); font-weight:500; paint-order:stroke; stroke:var(--background); stroke-width:5; stroke-linejoin:round; }
    #hulunbuir-roadtrip-map .km { fill:var(--muted-foreground); paint-order:stroke; stroke:var(--background); stroke-width:5; stroke-linejoin:round; }
    #hulunbuir-roadtrip-map .feature { fill:var(--muted-foreground); }
    #hulunbuir-roadtrip-map .feature-line { stroke:var(--border); stroke-width:1.5; }
    #hulunbuir-roadtrip-map .legend { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted-foreground); margin:8px 0 12px; }
    #hulunbuir-roadtrip-map .legend span { display:inline-flex; gap:7px; align-items:center; }
    #hulunbuir-roadtrip-map .line-key { width:25px; border-top:4px solid var(--viz-series-1); }
    #hulunbuir-roadtrip-map .line-key.alt { border-top-color:var(--viz-series-2); border-top-style:dashed; }
    #hulunbuir-roadtrip-map .line-key.forest { border-top-color:var(--viz-series-3); border-top-width:6px; }
    #hulunbuir-roadtrip-map .day-strip { margin:10px 0 14px; }
    #hulunbuir-roadtrip-map .detail { display:grid; grid-template-columns:minmax(120px,.7fr) 2fr; gap:18px; align-items:start; }
    #hulunbuir-roadtrip-map .detail-title { font-weight:500; }
    #hulunbuir-roadtrip-map .detail-km { color:var(--viz-series-1); margin-top:4px; }
    #hulunbuir-roadtrip-map .detail-spots { color:var(--card-foreground); }
    #hulunbuir-roadtrip-map .note { color:var(--muted-foreground); margin-top:8px; }
    @media (max-width:560px) {
      #hulunbuir-roadtrip-map .map-wrap, #hulunbuir-roadtrip-map .map-svg { min-height:610px; }
      #hulunbuir-roadtrip-map .detail { grid-template-columns:1fr; gap:8px; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;route-head&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;呼伦贝尔亲子自驾环线&lt;/h2&gt;
      &lt;div class=&quot;route-meta&quot;&gt;2026.09.26—10.05 · 10天 · 约1,330公里&lt;/div&gt;
    &lt;/div&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;海拉尔取还车&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;map-wrap&quot;&gt;
    &lt;svg class=&quot;map-svg&quot; role=&quot;img&quot; aria-labelledby=&quot;hlb-map-title hlb-map-desc&quot;&gt;
      &lt;title id=&quot;hlb-map-title&quot;&gt;呼伦贝尔十天亲子自驾路线示意图&lt;/title&gt;
      &lt;desc id=&quot;hlb-map-desc&quot;&gt;路线从海拉尔出发，经额尔古纳、根河、莫尔道嘎、室韦、黑山头和满洲里后返回海拉尔，其中根河至室韦为大兴安岭森林段。&lt;/desc&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend text-small&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;line-key&quot;&gt;&lt;/i&gt;草原/边境环线&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;line-key forest&quot;&gt;&lt;/i&gt;大兴安岭森林段&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;line-key alt&quot;&gt;&lt;/i&gt;满洲里返回海拉尔&lt;/span&gt;
    &lt;span&gt;● 点击站点查看打卡景点&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls day-strip&quot; aria-label=&quot;选择行程站点&quot;&gt;&lt;/div&gt;

  &lt;section class=&quot;card detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;detail-title&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;detail-km&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;detail-spots&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;div class=&quot;note text-small&quot;&gt;地理方位与距离的行程示意图，非导航地图；边境卡线是否通行以出发前实时路况为准。&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;hulunbuir-roadtrip-map&#x27;);
      const svg = root.querySelector(&#x27;.map-svg&#x27;);
      const controls = root.querySelector(&#x27;.day-strip&#x27;);
      const title = root.querySelector(&#x27;.detail-title&#x27;);
      const km = root.querySelector(&#x27;.detail-km&#x27;);
      const spots = root.querySelector(&#x27;.detail-spots&#x27;);
      const stops = [
        {id:0, day:&#x27;D1/D9&#x27;, name:&#x27;海拉尔&#x27;, x:.72, y:.70, leg:&#x27;取还车 · 市内约70公里&#x27;, spots:&#x27;呼伦贝尔博物院 · 伊敏河夜景 · 呼和诺尔备选&#x27;},
        {id:1, day:&#x27;D2&#x27;, name:&#x27;额尔古纳&#x27;, x:.53, y:.51, leg:&#x27;海拉尔 → 额尔古纳 约145公里&#x27;, spots:&#x27;莫尔格勒河 · 额尔古纳湿地 · 湿地日落&#x27;},
        {id:2, day:&#x27;D3&#x27;, name:&#x27;根河&#x27;, x:.66, y:.32, leg:&#x27;额尔古纳 → 根河 约125公里&#x27;, spots:&#x27;敖鲁古雅使鹿部落 · 根河湿地 · 冷极小城&#x27;},
        {id:3, day:&#x27;D4&#x27;, name:&#x27;莫尔道嘎&#x27;, x:.61, y:.16, leg:&#x27;根河 → 莫尔道嘎 约135公里&#x27;, spots:&#x27;大兴安岭林海 · 莫尔道嘎森林公园外围 · 森林公路&#x27;},
        {id:4, day:&#x27;D4&#x27;, name:&#x27;室韦&#x27;, x:.34, y:.14, leg:&#x27;莫尔道嘎 → 室韦 约100公里&#x27;, spots:&#x27;额尔古纳界河 · 室韦口岸外观 · 俄罗斯族乡&#x27;},
        {id:5, day:&#x27;D5&#x27;, name:&#x27;黑山头&#x27;, x:.27, y:.50, leg:&#x27;室韦 → 黑山头 约190公里&#x27;, spots:&#x27;七卡/五卡 · G331边境风光 · 黑山头日落&#x27;},
        {id:6, day:&#x27;D6–7&#x27;, name:&#x27;满洲里&#x27;, x:.16, y:.78, leg:&#x27;黑山头 → 满洲里 约210公里&#x27;, spots:&#x27;186彩带河 · 套娃广场 · 国门外观 · 扎赉诺尔博物馆&#x27;},
        {id:7, day:&#x27;D8&#x27;, name:&#x27;呼伦湖&#x27;, x:.39, y:.86, leg:&#x27;满洲里 → 呼伦湖 → 海拉尔 约235公里&#x27;, spots:&#x27;呼伦湖观景 · 草原公路 · 海拉尔返程缓冲&#x27;}
      ];
      const legs = [
        {a:0,b:1,label:&#x27;145 km&#x27;}, {a:1,b:2,label:&#x27;125 km&#x27;}, {a:2,b:3,label:&#x27;135 km&#x27;},
        {a:3,b:4,label:&#x27;100 km&#x27;}, {a:4,b:5,label:&#x27;190 km&#x27;}, {a:5,b:6,label:&#x27;210 km&#x27;},
        {a:6,b:7,label:&#x27;约70 km&#x27;}, {a:7,b:0,label:&#x27;约165 km&#x27;,alt:true}
      ];
      const features = [
        {x:.48,y:.41,t:&#x27;额尔古纳湿地&#x27;}, {x:.73,y:.24,t:&#x27;敖鲁古雅&#x27;}, {x:.22,y:.60,t:&#x27;186彩带河&#x27;},
        {x:.12,y:.90,t:&#x27;中俄边境&#x27;}, {x:.53,y:.91,t:&#x27;草原腹地&#x27;}, {x:.76,y:.10,t:&#x27;大兴安岭林海&#x27;}
      ];
      let active = 0;

      controls.innerHTML = stops.map(s =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-stop=&quot;${s.id}&quot; aria-pressed=&quot;${s.id===0}&quot;&gt;${s.day} ${s.name}&lt;/button&gt;`).join(&#x27;&#x27;);

      const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
      function select(id) {
        active = id;
        const s = stops[id];
        title.textContent = `${s.day} · ${s.name}`;
        km.textContent = s.leg;
        spots.textContent = `打卡：${s.spots}`;
        controls.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(Number(b.dataset.stop) === id)));
        svg.querySelectorAll(&#x27;.node&#x27;).forEach(n =&gt; n.classList.toggle(&#x27;active&#x27;, Number(n.dataset.stop) === id));
      }
      controls.addEventListener(&#x27;click&#x27;, e =&gt; {
        const b = e.target.closest(&#x27;button[data-stop]&#x27;);
        if (b) select(Number(b.dataset.stop));
      });

      function draw() {
        const w = Math.max(320, Math.round(root.querySelector(&#x27;.map-wrap&#x27;).getBoundingClientRect().width));
        const h = w &lt; 560 ? 610 : Math.min(610, Math.max(520, Math.round(w * .68)));
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${w} ${h}`);
        svg.setAttribute(&#x27;height&#x27;, h);
        const padX = w &lt; 560 ? 20 : 38, padY = 30;
        const X = p =&gt; padX + p * (w - 2*padX);
        const Y = p =&gt; padY + p * (h - 2*padY);
        const pts = stops.map(s =&gt; ({...s, px:X(s.x), py:Y(s.y)}));
        const routePts = [0,1,2,3,4,5,6,7].map(i =&gt; `${pts[i].px},${pts[i].py}`).join(&#x27; &#x27;);
        const returnPts = `${pts[7].px},${pts[7].py} ${pts[0].px},${pts[0].py}`;
        const labelSide = i =&gt; (w &lt; 560 ? (i % 2 ? -1 : 1) : ([3,4,5,6].includes(i) ? -1 : 1));
        svg.innerHTML = `
          &lt;title id=&quot;hlb-map-title&quot;&gt;呼伦贝尔十天亲子自驾路线示意图&lt;/title&gt;
          &lt;desc id=&quot;hlb-map-desc&quot;&gt;从海拉尔出发，经额尔古纳、根河、莫尔道嘎、室韦、黑山头和满洲里后返回海拉尔。&lt;/desc&gt;
          &lt;path class=&quot;terrain&quot; d=&quot;M${X(.08)},${Y(.16)} C${X(.24)},${Y(.02)} ${X(.70)},${Y(.02)} ${X(.88)},${Y(.17)} C${X(.98)},${Y(.34)} ${X(.92)},${Y(.76)} ${X(.70)},${Y(.91)} C${X(.47)},${Y(.99)} ${X(.13)},${Y(.94)} ${X(.05)},${Y(.70)} C${X(-.02)},${Y(.49)} ${X(.00)},${Y(.28)} ${X(.08)},${Y(.16)}Z&quot;/&gt;
          &lt;path class=&quot;river&quot; d=&quot;M${X(.26)},${Y(.04)} C${X(.16)},${Y(.23)} ${X(.20)},${Y(.47)} ${X(.10)},${Y(.66)} C${X(.05)},${Y(.76)} ${X(.09)},${Y(.88)} ${X(.15)},${Y(.96)}&quot;/&gt;
          &lt;polyline class=&quot;route-shadow&quot; points=&quot;${routePts}&quot;/&gt;
          &lt;polyline class=&quot;route-line&quot; points=&quot;${routePts}&quot;/&gt;
          &lt;polyline class=&quot;forest-line&quot; points=&quot;${[1,2,3,4].map(i =&gt; `${pts[i].px},${pts[i].py}`).join(&#x27; &#x27;)}&quot;/&gt;
          &lt;polyline class=&quot;route-shadow&quot; points=&quot;${returnPts}&quot;/&gt;
          &lt;polyline class=&quot;return-line&quot; points=&quot;${returnPts}&quot;/&gt;
          ${legs.map((l,i) =&gt; {
            const a=pts[l.a], b=pts[l.b], mx=(a.px+b.px)/2, my=(a.py+b.py)/2;
            const dy = i===7 ? 24 : (i%2 ? -12 : 18);
            return `&lt;text class=&quot;km text-small&quot; x=&quot;${mx}&quot; y=&quot;${my+dy}&quot; text-anchor=&quot;middle&quot;&gt;${esc(l.label)}&lt;/text&gt;`;
          }).join(&#x27;&#x27;)}
          ${features.map(f =&gt; `&lt;g&gt;&lt;line class=&quot;feature-line&quot; x1=&quot;${X(f.x)-8}&quot; y1=&quot;${Y(f.y)}&quot; x2=&quot;${X(f.x)+8}&quot; y2=&quot;${Y(f.y)}&quot;/&gt;&lt;text class=&quot;feature text-small&quot; x=&quot;${X(f.x)}&quot; y=&quot;${Y(f.y)-8}&quot; text-anchor=&quot;middle&quot;&gt;${esc(f.t)}&lt;/text&gt;&lt;/g&gt;`).join(&#x27;&#x27;)}
          ${pts.map((s,i) =&gt; {
            const side=labelSide(i), anchor=side&gt;0?&#x27;start&#x27;:&#x27;end&#x27;;
            return `&lt;g class=&quot;node ${i===active?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-stop=&quot;${i}&quot; aria-label=&quot;${esc(s.day+&#x27; &#x27;+s.name)}&quot;&gt;
              &lt;circle class=&quot;node-dot&quot; cx=&quot;${s.px}&quot; cy=&quot;${s.py}&quot; r=&quot;15&quot;/&gt;
              &lt;text class=&quot;node-num&quot; x=&quot;${s.px}&quot; y=&quot;${s.py}&quot;&gt;${i+1}&lt;/text&gt;
              &lt;text class=&quot;place&quot; x=&quot;${s.px+side*23}&quot; y=&quot;${s.py-2}&quot; text-anchor=&quot;${anchor}&quot;&gt;${esc(s.name)}&lt;/text&gt;
              &lt;text class=&quot;km text-small&quot; x=&quot;${s.px+side*23}&quot; y=&quot;${s.py+16}&quot; text-anchor=&quot;${anchor}&quot;&gt;${esc(s.day)}&lt;/text&gt;
            &lt;/g&gt;`;
          }).join(&#x27;&#x27;)}
        `;
        svg.querySelectorAll(&#x27;.node&#x27;).forEach(n =&gt; n.addEventListener(&#x27;click&#x27;, () =&gt; select(Number(n.dataset.stop))));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

    autoUpdateCleanup?.();

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),

    })
      .then(({ x, y }) =&gt; {

      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
