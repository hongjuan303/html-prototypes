<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc"><title id="title">高光混剪业务流程</title><desc id="desc">本地批量导入或员工授权的国内海外绿台选集，配置剪辑参数后，系统校验、分析剧情、编排高光、合成质检。成片可预览下载、反馈返工，人工确认后按来源同步国内或海外素材管理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#527b80"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#284246}.label{font-size:17px;font-weight:650}.sub{font-size:14px;fill:#51696d}.lane{font-size:16px;font-weight:650;fill:#087f8c}.edge{stroke:#527b80;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.return{stroke-dasharray:5 4}.small{font-size:13px;fill:#60787a}</style><rect width="1000" height="830" fill="#fff" rx="8"/><text x="30" y="30" class="lane" text-anchor="start">① 剧目管理导入 / 制作素材配置</text><rect x="30" y="55" width="190" height="78" rx="6" fill="#fff" stroke="#c8d8db"/><text x="125.0" y="84" class="label" text-anchor="middle">本地批量导入</text><text x="125.0" y="108" class="sub" text-anchor="middle">核对文件与集序</text><rect x="250" y="55" width="220" height="78" rx="6" fill="#fff" stroke="#c8d8db"/><text x="360.0" y="84" class="label" text-anchor="middle">授权绿台合集</text><text x="360.0" y="108" class="sub" text-anchor="middle">员工授权来源 · 配置选集</text><rect x="530" y="55" width="430" height="78" rx="6" fill="#fff" stroke="#c8d8db"/><text x="745.0" y="84" class="label" text-anchor="middle">高光混剪参数</text><text x="745.0" y="108" class="sub" text-anchor="middle">条数 · 最终时长 · 成片速度 · 字幕 / BGM / 小标题</text><path d="M125 133V157H485" class="edge "/><path d="M360 133V157H485" class="edge "/><path d="M745 133V157H491" class="edge "/><path d="M485 157V178H15V283H24" class="edge "/><text x="30" y="199" class="lane" text-anchor="start">② 系统自动处理</text><rect x="30" y="220" width="210" height="126" rx="6" fill="#edf6f6" stroke="#98c2c5"/><text x="135.0" y="249" class="label" text-anchor="middle">校验片源与配置</text><text x="135.0" y="273" class="sub" text-anchor="middle">授权、格式、缺集 / 重复集</text><text x="135.0" y="294" class="sub" text-anchor="middle">参数及积分余额</text><rect x="270" y="220" width="210" height="126" rx="6" fill="#edf6f6" stroke="#98c2c5"/><text x="375.0" y="249" class="label" text-anchor="middle">剧情分析与复用</text><text x="375.0" y="273" class="sub" text-anchor="middle">对白识别、人物与事件</text><text x="375.0" y="294" class="sub" text-anchor="middle">保留原片时间码</text><text x="375.0" y="315" class="sub" text-anchor="middle">有效复用，新增补分析</text><rect x="510" y="220" width="210" height="126" rx="6" fill="#edf6f6" stroke="#98c2c5"/><text x="615.0" y="249" class="label" text-anchor="middle">高光选段与编排</text><text x="615.0" y="273" class="sub" text-anchor="middle">冲突开场、必要铺垫</text><text x="615.0" y="294" class="sub" text-anchor="middle">完整对白与悬念</text><text x="615.0" y="315" class="sub" text-anchor="middle">同批 / 历史内容差异</text><rect x="750" y="220" width="210" height="126" rx="6" fill="#edf6f6" stroke="#98c2c5"/><text x="855.0" y="249" class="label" text-anchor="middle">包装合成与质检</text><text x="855.0" y="273" class="sub" text-anchor="middle">速度、字幕、BGM、标题</text><text x="855.0" y="294" class="sub" text-anchor="middle">合成视频并检查缺陷</text><text x="855.0" y="315" class="sub" text-anchor="middle">可修复问题先补救</text><path d="M240 284H264" class="edge "/><path d="M480 284H504" class="edge "/><path d="M720 284H744" class="edge "/><path d="M855 346V379H340V430H160V433" class="edge "/><text x="30" y="415" class="lane" text-anchor="start">③ 成片管理：预览、确认与交付</text><rect x="30" y="440" width="260" height="91" rx="6" fill="#fff" stroke="#c8d8db"/><text x="160.0" y="469" class="label" text-anchor="middle">成片管理与预览</text><text x="160.0" y="493" class="sub" text-anchor="middle">逐条查看进度、播放</text><text x="160.0" y="514" class="sub" text-anchor="middle">下载MP4成片</text><rect x="400" y="440" width="190" height="91" rx="6" fill="#fff" stroke="#c8d8db"/><text x="495.0" y="469" class="label" text-anchor="middle">人工确认可用</text><text x="495.0" y="493" class="sub" text-anchor="middle">人工勾选，绑定当前版本</text><rect x="690" y="440" width="270" height="91" rx="6" fill="#fff" stroke="#c8d8db"/><text x="825.0" y="469" class="label" text-anchor="middle">同步到素材管理</text><text x="825.0" y="493" class="sub" text-anchor="middle">当前 / 批量已确认成片</text><path d="M290 485H392" class="edge "/><text x="346" y="470" class="small" text-anchor="middle">符合交付条件</text><path d="M590 485H682" class="edge "/><rect x="30" y="606" width="260" height="113" rx="6" fill="#fff" stroke="#c8d8db"/><text x="160.0" y="635" class="label" text-anchor="middle">问题反馈 / 单条返工</text><text x="160.0" y="659" class="sub" text-anchor="middle">起止时间段或整条</text><text x="160.0" y="680" class="sub" text-anchor="middle">质量补救 / 创作报价</text><text x="160.0" y="701" class="sub" text-anchor="middle">完成后回预览并重新确认</text><path d="M160 531V599" class="edge "/><text x="171" y="571" class="small" text-anchor="start">有问题 / 想调整</text><path d="M30 664H12V485H24" class="edge return"/><text x="750" y="566" class="small" text-anchor="middle">按来源路由；本地未知时先选择目标</text><path d="M825 531V541H978V597H590V632" class="edge "/><path d="M978 597H850V632" class="edge "/><rect x="470" y="640" width="240" height="79" rx="6" fill="#fff" stroke="#c8d8db"/><text x="590.0" y="669" class="label" text-anchor="middle">容量广告 · 素材管理</text><text x="590.0" y="693" class="sub" text-anchor="middle">五项信息 · 今天及以后</text><rect x="740" y="640" width="220" height="79" rx="6" fill="#fff" stroke="#c8d8db"/><text x="850.0" y="669" class="label" text-anchor="middle">容量海外短剧 · 素材管理</text><text x="850.0" y="693" class="sub" text-anchor="middle">三项：目录 / 人员 / 名称</text><rect x="30" y="750" width="930" height="60" rx="6" fill="#f6f8f8"/><text x="45" y="774" class="small" text-anchor="start">数量不足：确认实际条数或返回配置　 ·　 生成失败：仅补失败项</text><text x="45" y="797" class="small" text-anchor="start">同步失败：只重试失败项　 ·　 结果待核实：先查询，避免重复上传</text></svg>