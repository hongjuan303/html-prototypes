<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">高光顺剪业务流程</title><desc id="desc">导入原片并配置，成功提交后提示异步制作并清空表单。任务列表跟踪进度，任务详情即时提供成功素材预览下载，失败统一联系技术排查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527b80"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial;fill:#284246}.label{font-size:17px;font-weight:650}.sub{font-size:14px;fill:#51696d}.lane{font-size:17px;font-weight:650;fill:#087f8c}.edge{stroke:#527b80;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="760" rx="8" fill="white"/><text x="30" y="35" class="lane" text-anchor="start">① 导入与制作</text><rect x="30" y="55" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="165.0" y="85" class="label" text-anchor="middle">新增短剧 / 导入合集</text><text x="165.0" y="112" class="sub" text-anchor="middle">剧目管理预先导入 / 制作页导入</text><text x="165.0" y="134" class="sub" text-anchor="middle">网盘分析后选集 / 本地多视频</text><rect x="365" y="55" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="500.0" y="85" class="label" text-anchor="middle">配置并生成视频</text><text x="500.0" y="112" class="sub" text-anchor="middle">选集、条数、速度、时长</text><text x="500.0" y="134" class="sub" text-anchor="middle">BGM / 引流小标题</text><rect x="700" y="55" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="835.0" y="85" class="label" text-anchor="middle">任务受理成功</text><text x="835.0" y="112" class="sub" text-anchor="middle">提示视频生成中</text><text x="835.0" y="134" class="sub" text-anchor="middle">关闭清空表单 / 查看任务</text><path d="M300 110H357" class="edge"/><path d="M635 110H692" class="edge"/><text x="30" y="220" class="lane" text-anchor="start">② 后台异步制作</text><rect x="30" y="240" width="190" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="125.0" y="270" class="label" text-anchor="middle">分析原片</text><text x="125.0" y="297" class="sub" text-anchor="middle">对白、镜头、人物与事件</text><text x="125.0" y="319" class="sub" text-anchor="middle">有效分析复用</text><rect x="280" y="240" width="190" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="375.0" y="270" class="label" text-anchor="middle">高光编排</text><text x="375.0" y="297" class="sub" text-anchor="middle">完整对白、按剧情顺序</text><text x="375.0" y="319" class="sub" text-anchor="middle">差异化选段与时长校验</text><rect x="530" y="240" width="190" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="625.0" y="270" class="label" text-anchor="middle">合成与检查</text><text x="625.0" y="297" class="sub" text-anchor="middle">变速、BGM、小标题</text><text x="625.0" y="319" class="sub" text-anchor="middle">画面、音频与时长检查</text><rect x="780" y="240" width="190" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="875.0" y="270" class="label" text-anchor="middle">逐条记录结果</text><text x="875.0" y="297" class="sub" text-anchor="middle">成功可用即交付</text><text x="875.0" y="319" class="sub" text-anchor="middle">失败释放对应额度</text><path d="M835 169V200H125V232" class="edge"/><path d="M220 295H272" class="edge"/><path d="M470 295H522" class="edge"/><path d="M720 295H772" class="edge"/><text x="30" y="405" class="lane" text-anchor="start">③ 成片管理</text><rect x="30" y="425" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="165.0" y="455" class="label" text-anchor="middle">任务卡片列表</text><text x="165.0" y="482" class="sub" text-anchor="middle">剧名、任务版本V1/V2…、类型</text><text x="165.0" y="504" class="sub" text-anchor="middle">时间、集数、完成X/Y条</text><rect x="365" y="425" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="500.0" y="455" class="label" text-anchor="middle">任务详情</text><text x="500.0" y="482" class="sub" text-anchor="middle">成功素材即时预览 / 下载</text><text x="500.0" y="504" class="sub" text-anchor="middle">其他素材处理中也可使用</text><rect x="700" y="425" width="270" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="835.0" y="455" class="label" text-anchor="middle">部分 / 全部生成异常</text><text x="835.0" y="482" class="sub" text-anchor="middle">请联系技术排查</text><text x="835.0" y="504" class="sub" text-anchor="middle">保留成功素材，不提供重试</text><path d="M875 354V383H165V417" class="edge"/><path d="M300 480H357" class="edge"/><path d="M635 480H692" class="edge"/><rect x="30" y="600" width="940" height="114" rx="6" fill="#f4f9f9" stroke="#b9d0d3"/><text x="500.0" y="630" class="label" text-anchor="middle">任务状态</text><text x="500.0" y="657" class="sub" text-anchor="middle">剪辑中：仍有素材处理中   ·   已完成：全部成功</text><text x="500.0" y="679" class="sub" text-anchor="middle">部分失败：结束且部分成功   ·   已失败：结束且零成功</text></svg>