<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>容量万相</title>
  <link rel="icon" type="image/png" href="./assets/qa-logo.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="navbar-header">
    <nav class="navbar-bar" aria-label="主导航">
      <a class="navbar-brand" href="#home" data-route="home" aria-label="容量万相首页">
        <img class="navbar-logo" src="./assets/qa-logo.png" alt="容量万相">
      </a>
      <div class="navbar-list" id="primaryNav"></div>
      <div class="navbar-actions">
        <div class="language-menu" id="languageMenu">
          <button class="navbar-action-language" id="languageButton" type="button" aria-haspopup="menu" aria-expanded="false">
            <i data-lucide="globe-2" aria-hidden="true"></i>
            <span id="languageLabel">简体中文</span>
            <i class="language-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <div class="language-popover" role="menu" hidden>
            <button type="button" data-edition="cn" role="menuitem">简体中文<i data-lucide="check"></i></button>
            <button type="button" data-edition="global" role="menuitem">English<i data-lucide="check"></i></button>
          </div>
        </div>
        <button class="navbar-action-business" id="businessButton" type="button">商务合作</button>
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="打开菜单" aria-expanded="false">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
      </div>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-overlay" id="modalBackdrop" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <button class="modal-close" id="dialogClose" type="button" aria-label="关闭">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
      <div id="dialogContent"></div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
